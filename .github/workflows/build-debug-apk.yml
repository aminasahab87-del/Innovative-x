name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as a GitHub Release?'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag (e.g. v2.4.0)'
        required: false
        type: string
        default: 'v2.4.0'

permissions:
  contents: write

jobs:
  build:
    name: Build & Export Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Restore Keystore & Configuration
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
            echo "Restored debug.keystore from base64"
          fi
          if [ ! -f .env ]; then
            echo "GEMINI_API_KEY=dummy_key" > .env
            echo "Created fallback .env"
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate and Stage APK
        run: |
          mkdir -p build-artifacts
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" build-artifacts/InnovateX-debug.apk
            echo "Staged APK to build-artifacts/InnovateX-debug.apk"
          else
            echo "Error: Debug APK not found!"
            find app/build/outputs -type f || true
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InnovateX-Debug-APK
          path: build-artifacts/InnovateX-debug.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        continue-on-error: true
        with:
          artifacts: "build-artifacts/*.apk"
          tag: ${{ inputs.release_tag || 'v2.4.0' }}
          name: "InnovateX Debug Build ${{ inputs.release_tag || 'v2.4.0' }}"
          body: |
            ## 🚀 InnovateX Android Debug APK (${{ inputs.release_tag || 'v2.4.0' }})

            ### 📥 Download:
            Download **`InnovateX-debug.apk`** below to test and install directly on your Android phone or emulator.

            ### 📱 What's Included:
            - **Developer**: Aafaq Hussain
            - **App**: InnovateX STEM & Robotics Platform (v2.4.0)
            - **Features**:
              - 🎥 Zoom Live Classes with Meeting ID & Password
              - ⭐ Star Rating & Constructive Peer Reviews
              - 🔒 JazzCash/EasyPaisa QR Scanner Subscription (250 PKR / 10 Days)
              - 🛡️ Admin & Reviewer Verification Portal
              - 🎓 Student Prototype Submissions & AI Scoring
          allowUpdates: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
