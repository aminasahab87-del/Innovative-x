name: Build Android APK & Publish Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk output/InnovateX-App-debug.apk
            echo "APK successfully prepared at output/InnovateX-App-debug.apk"
          else
            echo "Searching for APK files..."
            find app/build/outputs/apk -name "*.apk" -exec cp {} output/InnovateX-App-debug.apk \;
          fi

      - name: Upload APK Artifact (Actions Summary)
        uses: actions/upload-artifact@v4
        with:
          name: InnovateX-Android-APK
          path: output/*.apk
          retention-days: 30

      - name: Create GitHub Release & Attach APK
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.0-release' }}
          name: InnovateX Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.0' }}
          body: |
            ## 🚀 InnovateX App - Latest Build

            Download the pre-compiled Android APK (`InnovateX-App-debug.apk`) below and install directly on your Android phone!

            ### 🌟 Latest Features Included:
            - **🎥 Zoom Live Classes**: Interactive STEM & robotics live classes with Meeting ID & Password sharing.
            - **🔒 Payment Lock & Scanner**: 250 PKR / 10 Days subscription with official QR Scanner & Admin TRX verification workflow.
            - **🖼️ Profile Customization**: Gallery picker, manual image URL input, and preset avatar choices.
            - **⭐ Star Rating & Reviews**: Rate and review student projects with star ratings.
            - **📸 Gallery Media Upload**: Pick photos and videos directly from gallery for submissions.
            - **🛡️ Admin & Reviewer Portal**: Full project review, badge assignment, and payment verification system.

            ### 📱 How to Install:
            1. Scroll down to **Assets** and tap **`InnovateX-App-debug.apk`** to download.
            2. Tap the downloaded APK on your phone.
            3. If prompted, select **"Allow from this source"** to enable installation.
            4. Enjoy InnovateX!
          files: output/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
