name: Build Android APK & Publish Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore debug.keystore & local.properties
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Restored debug.keystore from base64"
          fi
          if [ ! -f .env ]; then
            echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk output/InnovateX-App-v1.1.0.apk
            echo "APK successfully prepared at output/InnovateX-App-v1.1.0.apk"
          else
            echo "Searching for APK files..."
            find app/build/outputs/apk -name "*.apk" -exec cp {} output/InnovateX-App-v1.1.0.apk \;
          fi

      - name: Upload APK Artifact (Actions Summary)
        uses: actions/upload-artifact@v4
        with:
          name: InnovateX-Android-APK
          path: output/*.apk
          retention-days: 30

      - name: Create GitHub Release & Attach APK
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        continue-on-error: true
        with:
          artifacts: "output/*.apk"
          tag: "v1.1.0"
          name: "InnovateX Release v1.1.0"
          body: |
            ## 🚀 InnovateX App - Official Release v1.1.0

            Download the pre-compiled Android APK (`InnovateX-App-v1.1.0.apk`) below and install directly on your Android phone!

            ### 🌟 Key Features Included:
            - **🎥 Zoom Live Classes**: Interactive STEM & robotics live classes with Meeting ID & Password sharing.
            - **🔒 Payment Lock & Scanner**: 250 PKR / 10 Days subscription with official QR Scanner & Admin TRX verification workflow.
            - **🖼️ Profile Customization**: Gallery picker, manual image URL input, and preset avatar choices.
            - **⭐ Star Rating & Reviews**: Rate and review student projects with star ratings.
            - **📸 Gallery Media Upload**: Pick photos and videos directly from gallery for submissions.
            - **🛡️ Admin & Reviewer Portal**: Full project review, badge assignment, and payment verification system.

            ### 📱 How to Install:
            1. Scroll down to **Assets** and tap **`InnovateX-App-v1.1.0.apk`** to download.
            2. Tap the downloaded APK on your phone.
            3. If prompted, select **"Allow from this source"** to enable installation.
            4. Enjoy InnovateX!
          allowUpdates: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
